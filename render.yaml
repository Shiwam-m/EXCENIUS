# Render Infrastructure Blueprint
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Fast, 100% Free Global CDN Static Site
  # - Never goes to sleep
  # - Zero lag (loads in <100ms)
  # - Web3Forms delivers instant emails to shiwammaddheshiya@gmail.com
  - type: web
    name: noirform-agency
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
